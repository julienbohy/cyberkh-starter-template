# The processes that `symfony server:start` runs next to the web server.
workers:
    # Sends the emails queued in the "async" transport.
    messenger_consume_async:
        cmd: ['symfony', 'console', 'messenger:consume', 'async']
        watch: ['config', 'src', 'templates', 'vendor/composer']

    # Rebuilds the CSS when a template changes.
    tailwind:
        cmd: ['symfony', 'console', 'tailwind:build', '--watch']
