grumphp:
    # The hooks run through the Symfony CLI so that they use the PHP of .php-version.
    git_hook_variables:
        EXEC_GRUMPHP_COMMAND: 'symfony php'
    tasks:
        # The projects created from the template have no name nor description: Flex removes them.
        composer:
            no_check_publish: true
        ecs: ~
        phpstan:
            memory_limit: '1G'
            ignore_patterns: ['/^\.castor\.stub\.php$/']
        twigcsfixer:
            paths: ['templates']
        yamllint:
            parse_custom_tags: true
