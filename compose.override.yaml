# Fixed host ports, so that the URLs of .env work even when the Symfony CLI does not see Docker.
# Set in .env, and in .env.local to change them: `castor start` passes both to Docker Compose.
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MAILER_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILER_WEB_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
