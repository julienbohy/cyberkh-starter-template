# The production: the prod image, which holds the code, the dependencies and the assets.
#   docker compose -f compose.yaml -f compose.prod.yaml up --detach --wait --build
# The migrations run on their own, before the application and the worker start.
# APP_SECRET, POSTGRES_PASSWORD, MERCURE_JWT_SECRET, SERVER_NAME (your domain), MAILER_DSN and MAILER_FROM come from
# the environment of the host: Caddy gets the HTTPS certificate of SERVER_NAME on its own.

x-app-prod-environment: &app-prod-environment
  APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
  DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=utf8
  LOCK_DSN: postgresql+advisory://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@database:5432/${POSTGRES_DB:-app}
  MAILER_DSN: ${MAILER_DSN:?MAILER_DSN is required}
  MAILER_FROM: ${MAILER_FROM:?MAILER_FROM is required}
  DEFAULT_URI: https://${SERVER_NAME:-localhost}
  # Given here: composer dump-env bakes the .env one, built from the development DEFAULT_URI.
  MERCURE_PUBLIC_URL: https://${SERVER_NAME:-localhost}/.well-known/mercure
  # Signs the JWTs of the Mercure hub (HS256): at least 32 bytes.
  MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET is required}
  # The uploaded files: in the app_storage volume (local), or on S3.
  STORAGE_ADAPTER: ${STORAGE_ADAPTER:-local}
  S3_BUCKET: ${S3_BUCKET:-app}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_PATH_STYLE: ${S3_PATH_STYLE:-0}

services:
  php:
    build:
      context: .
      target: frankenphp_prod
    environment:
      <<: *app-prod-environment
      # The hub of the Caddyfile, with the required secret and the issuer of the production.
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET is required}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET is required}
      MERCURE_TRUSTED_ISSUERS: https://${SERVER_NAME:-localhost}
    volumes:
      - app_storage:/app/var/storage
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3
      - "443:443/udp"
    depends_on:
      migrations:
        condition: service_completed_successfully

  messenger:
    build:
      context: .
      target: frankenphp_prod
    restart: unless-stopped
    entrypoint: ["docker-php-entrypoint"]
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600"]
    environment:
      <<: *app-prod-environment
    volumes:
      - app_storage:/app/var/storage
    healthcheck:
      disable: true
    depends_on:
      # Its table, messenger_messages, comes from a migration.
      migrations:
        condition: service_completed_successfully

  # Runs the migrations, once the database is up, then exits: before the application and the
  # worker start, on each deployment.
  migrations:
    build:
      context: .
      target: frankenphp_prod
    restart: "no"
    entrypoint: ["docker-php-entrypoint"]
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--allow-no-migration"]
    environment:
      <<: *app-prod-environment
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_healthy

volumes:
  app_storage:
